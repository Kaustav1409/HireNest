spring.application.name=hirenest-backend

# Database — override SPRING_DATASOURCE_URL on Render to use a managed DB.
# Default: H2 file stored in /app/data (matches the Docker WORKDIR).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:/app/data/hirenest_db;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1;WRITE_DELAY=0;AUTO_SERVER=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:db/job_description_longtext.sql
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# H2 console — enable via env var if needed (disabled by default in production)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Render sets PORT automatically; fall back to 8080 for other environments
server.port=${PORT:${SERVER_PORT:8080}}

app.jwt.secret=${APP_JWT_SECRET:hirenest-super-secret-key-hirenest-super-secret-key}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
google.client.id=${GOOGLE_CLIENT_ID:}
app.google.client-id=${APP_GOOGLE_CLIENT_ID:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
